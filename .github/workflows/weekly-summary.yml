name: Weekly Progress Summary
on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Weekly Summary
        id: summary
        run: |
          mkdir -p reports
          DATE=$(date +'%Y-%m-%d')
          REPORT="reports/weekly_summary_${DATE}.md"
          echo "# Weekly Summary - ${DATE}" > $REPORT
          echo "" >> $REPORT
          echo "## ✅ Closed Issues" >> $REPORT
          gh issue list --state closed --limit 20 --json number,title,closedAt | jq -r '.[] | "- [#" + (.number|tostring) + "] " + .title + " (closed " + .closedAt + ")"' >> $REPORT
          echo "" >> $REPORT
          echo "## 🔀 Merged Pull Requests" >> $REPORT
          gh pr list --state merged --limit 20 --json number,title,mergedAt | jq -r '.[] | "- [#" + (.number|tostring) + "] " + .title + " (merged " + .mergedAt + ")"' >> $REPORT
          echo "" >> $REPORT
          echo "Report generated by GitHub Actions" >> $REPORT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Report
        run: |
          DATE=$(date +'%Y-%m-%d')
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/weekly_summary_${DATE}.md
          git commit -m "docs(reports): add weekly summary for ${DATE}" || echo "No changes to commit"
          git push

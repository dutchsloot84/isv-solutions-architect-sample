name: PR Lint and Validation
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
          token: ${{ secrets.GITHUB_TOKEN }}

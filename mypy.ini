[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_configs = True
namespace_packages = True
mypy_path = .
follow_imports = skip

[mypy-scripts.run_tests]
ignore_errors = True

[mypy-deepdiff]
ignore_missing_imports = True

[mypy-dotenv]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-jinja2]
ignore_missing_imports = True

[mypy-requests_oauthlib]
ignore_missing_imports = True

[mypy-requests_oauthlib.*]
ignore_missing_imports = True

id: "05"
title: "CLI Orchestrator and Version Tagger"
phase: build
branch: slice/05-cli-orchestrator
depends_on: ["04"]
description: >
  Deliver a command-line orchestrator coordinating analyzers, reporting,
  and release tagging workflows with structured logging and env awareness.
tasks:
  - name: Assemble orchestration commands and workflow runner
    output: modules/orchestrator/cli.py
  - name: Integrate semantic version tagging helper
    output: modules/orchestrator/versioning.py
artifacts:
  - ${ARTIFACT_ROOT}/05/cli/orchestrator_usage_<timestamp>.md
  - ${ARTIFACT_ROOT}/05/releases/version_tag_notes_<timestamp>.md
  - ${ARTIFACT_ROOT}/progress/05_<timestamp>.json
success_criteria:
  - CLI orchestrator runs build-phase analyzers end-to-end with structured logs.
  - Version tagging helper records release metadata while masking secrets.
  - Progress artifacts and documentation align with MOP Build Phase requirements.
